server.port=8081
spring.application.name=HotelManagementSystem

# SQL Server connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HotelManagementDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=[Enter Username]
spring.datasource.password=[Enter Password]
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update